# The VRF-aware agent implements the IP MIB tables itself: exclude net-snmp's
# own modules for them. Debian's snmpd.service passes options on its command
# line (DANOS's unit read them from a $TMP_OPTS file), so the exclusions join
# Debian's -I list here.
[Service]
ExecStart=
ExecStart=/usr/sbin/snmpd -LOw -u Debian-snmp -g Debian-snmp -I -smux,mteTrigger,mteTriggerConf,ip,ipv6,ipDefaultRouterTable,ipIfStatsTable,ipAddressTable,ipAddressPrefixTable,ipCidrRouteTable -f
